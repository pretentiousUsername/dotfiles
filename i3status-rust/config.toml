icons_format = "{icon}"

[theme]
# theme = "solarized-dark"
theme = "pywal"
# [theme.overrides]
# idle_bg = "#123456"
# idle_fg = "#abcdef"

[icons]
# icons = "awesome4"
icons = "material-nf"
# icons = "Font Awesome 7 Free"
[icons.overrides]
# bat = ["|E|", "|_|", "|=|", "|F|"]
bat = ["", "", "", "", ""]
bat_charging = ""
cpu = ""
memory = ""
temp = ["", "", "", "", ""]
vol = ["", "", ""]


[[block]]
block = "sound"
# format = "$icon $volume"
# show_volume_when_muted = false
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
# icon = ""

[[block]]
block = "memory"
format = " $icon $mem_used_percents.eng(w:2) "
#format = " $icon $mem_total_used_percents.eng(w:2) "
# format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "temperature"
format = " $icon $average "
format_alt = " $icon $average (avg.) / $max (max.) "
good = 20
idle = 45
warning = 80

[[block]]
block = "disk_space"
path = "/"
info_type = "used"
# alert_unit = "GB"
interval = 30
warning = 1000.0
alert = 2000.0
# format = " $icon root: $available.eng(w:2) "
format = " $icon $percentage.eng(w:2) "

[[block]]
block = "time"
interval = 15
[block.format]
full = " $timestamp.datetime(f:'%a %Y-%m-%d %R') "
short = " $timestamp.datetime(f:%R) "

[[block]]
block = "battery"
interval = 30
format = " $icon  $percentage "
# charging_format = "$icon $percentage"
good = 60
warning = 30
critical = 20
full_threshold = 80
